data:
  connectorSubtype: api
  connectorType: source
  definitionId: c332628c-f55c-4017-8222-378cfafda9b2
  dockerImageTag: 1.0.0
  dockerRepository: airbyte/source-convex
  githubIssueLabel: source-convex
  icon: convex.svg
  license: ELv2
  name: Convex
  remoteRegistries:
    pypi:
      enabled: true
      packageName: airbyte-source-convex
  registryOverrides:
    cloud:
      enabled: true
    oss:
      enabled: true
  releaseStage: alpha
  releases:
    breakingChanges:
      1.0.0:
        message: >-
          The connector now reads from the Convex Deployment API data sync endpoint (Convex Pro, deploy key with
          deployment:data:view). State is now a single resumable cursor, streams for tables inside components are
          named <component>__<table>, and each record carries _component and _table fields. Refresh the source
          schema and reset affected connections after upgrading.
        upgradeDeadline: "2026-12-01"
  documentationUrl: https://docs.airbyte.com/integrations/sources/convex
  tags:
    - language:python
    - cdk:python
  ab_internal:
    sl: 100
    ql: 100
  supportLevel: community
  connectorTestSuitesOptions:
    - suite: liveTests
      testConnections:
        - name: convex_config_dev_null
          id: 929eccf3-8e4c-4f73-af8b-48aa0b04b00c
    - suite: unitTests
    - suite: acceptanceTests
      testSecrets:
        - name: SECRET_SOURCE-CONVEX__CREDS
          fileName: config.json
          secretStore:
            type: GSM
            alias: airbyte-connector-testing-secret-store
  connectorBuildOptions:
    baseImage: docker.io/airbyte/python-connector-base:4.1.0@sha256:1d1aa21d34e851df4e8a87b391c27724c06e2597608e7161f4d167be853bd7b6
  externalDocumentationUrls:
    - title: Convex Data Sync API
      url: https://docs.convex.dev/deployment-api/data-sync
      type: api_reference
    - title: Convex authentication
      url: https://docs.convex.dev/auth
      type: authentication_guide
    - title: Convex Status
      url: https://status.convex.dev/
      type: status_page

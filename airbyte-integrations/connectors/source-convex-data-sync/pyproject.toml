[build-system]
requires = [ "poetry-core>=1.0.0",]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
version = "0.1.0"
name = "source-convex-data-sync"
description = "Source implementation for Convex, built on the Deployment API data sync endpoint."
authors = [ "Airbyte <contact@airbyte.io>",]
license = "ELv2"
readme = "README.md"
documentation = "https://docs.airbyte.com/integrations/sources/convex-data-sync"
homepage = "https://airbyte.com"
repository = "https://github.com/airbytehq/airbyte"
[[tool.poetry.packages]]
include = "source_convex_data_sync"

[tool.poetry.dependencies]
python = "^3.10,<3.13"
airbyte-cdk = "^6"

[tool.poetry.scripts]
source-convex-data-sync = "source_convex_data_sync.run:run"

[tool.poetry.group.dev.dependencies]
requests-mock = "^1.12"
pytest-mock = "^3.6.1"
pytest = "^8.0.0"


[tool.poe]
include = [
    # Shared tasks definition file(s) can be imported here.
    # Run `poe` or `poe --help` to see the list of available tasks.
    "${POE_GIT_DIR}/poe-tasks/poetry-connector-tasks.toml",
]
